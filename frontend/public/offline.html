<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#0f172a"/>
  <title>VitalityHub — Offline</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#0f172a;color:#e2e8f0;
      font-family:'DM Sans',system-ui,sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      text-align:center;padding:24px;
    }
    .card{
      background:#1e293b;border-radius:24px;padding:40px 32px;max-width:340px;
      box-shadow:5px 5px 16px #040810,-3px -3px 10px #1e3350;
    }
    .icon{font-size:64px;margin-bottom:20px;display:block}
    h1{font-size:22px;font-weight:700;margin-bottom:10px;letter-spacing:-0.5px}
    p{font-size:14px;color:#64748b;line-height:1.6;margin-bottom:24px}
    button{
      background:#0a1020;color:#22d3ee;border:1px solid #22d3ee44;
      padding:12px 28px;border-radius:14px;font-size:15px;font-weight:700;
      cursor:pointer;font-family:inherit;
      box-shadow:inset 3px 3px 8px #040810,inset -2px -2px 6px #1a2d48;
      transition:opacity .2s;
    }
    button:hover{opacity:.85}
    .badge{
      display:inline-block;background:#22d3ee18;border:1px solid #22d3ee44;
      border-radius:99px;padding:4px 14px;font-size:11px;color:#22d3ee;
      font-weight:700;margin-bottom:20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📡</span>
    <div class="badge">Offline Mode</div>
    <h1>No Connection</h1>
    <p>VitalityHub couldn't reach the server. Any vitals you log will sync automatically when you're back online.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
